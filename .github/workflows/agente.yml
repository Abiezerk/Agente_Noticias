name: Agente de Inteligencia Financiera

on:
  schedule:
    - cron: '0 16 * * 0'
  workflow_dispatch: 

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Actualizado de v3 a v4
      - name: Configurar Python
        uses: actions/setup-python@v5 # Actualizado de v4 a v5
        with:
          python-version: '3.10'
      - name: Instalar Dependencias
        run: pip install requests beautifulsoup4 pytz
      - name: Ejecutar Tarea Semanal
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agente_inteligente.py
