name: Agente de Inteligencia Financiera

on:
  schedule:
    # Se ejecuta todos los domingos a las 9:00 AM Tijuana (16:00 UTC)
    - cron: '0 16 * * 0'
  workflow_dispatch: # Esto te permite darle a un botón para probarlo YA

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar Dependencias
        run: pip install requests beautifulsoup4 pytz
      - name: Ejecutar Tarea Semanal
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python agente_inteligente.py
